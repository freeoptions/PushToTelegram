<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PushToBili UI 概念稿</title>
  <style>
    :root {
      --font-ui: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
      --font-num: "Segoe UI", "Microsoft YaHei UI", Arial, sans-serif;
      --shadow-soft: 0 24px 70px rgba(14, 22, 39, .18);
      --shadow-fine: 0 10px 30px rgba(14, 22, 39, .08);
      --radius: 8px;
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: var(--font-ui);
      background: #eef2f7;
    }

    body.single {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: center;
    }

    body.gallery {
      padding: 36px;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 28px;
      align-items: start;
    }

    .gallery-item {
      display: flex;
      flex-direction: column;
      gap: 12px;
      color: #0f172a;
    }

    .gallery-item h2 {
      margin: 0;
      font-size: 20px;
    }

    .gallery-item .artboard {
      transform: scale(.49);
      transform-origin: top left;
      margin-bottom: -459px;
    }

    .artboard {
      position: relative;
      width: 1440px;
      height: 900px;
      overflow: hidden;
      color: var(--ink);
      background: var(--bg);
      box-shadow: var(--shadow-soft);
    }

    .window {
      position: absolute;
      inset: 34px;
      overflow: hidden;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--window-shadow);
    }

    .topbar {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      border-bottom: 1px solid var(--line);
      background: var(--top);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: var(--mark-ink);
      background: var(--mark);
      font-weight: 900;
      letter-spacing: 0;
      box-shadow: var(--mark-shadow);
    }

    .brand-title {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand-title strong {
      font-size: 17px;
      line-height: 1;
    }

    .brand-title span {
      color: var(--muted);
      font-size: 12px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search {
      width: 240px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: var(--surface-2);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      font-size: 13px;
    }

    .status-pill {
      height: 34px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--success);
      background: var(--success-soft);
      border: 1px solid var(--success-line);
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 4px color-mix(in srgb, currentColor 15%, transparent);
    }

    .icon-btn,
    .primary-btn,
    .secondary-btn,
    .ghost-btn,
    .danger-btn {
      height: 38px;
      border-radius: 8px;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .icon-btn {
      width: 38px;
      padding: 0;
      color: var(--ink-2);
      background: var(--surface-2);
      border-color: var(--line);
    }

    .primary-btn {
      color: var(--primary-ink);
      background: var(--primary);
      box-shadow: var(--primary-shadow);
    }

    .secondary-btn {
      color: var(--primary);
      background: var(--primary-soft);
      border-color: var(--primary-line);
    }

    .ghost-btn {
      color: var(--ink-2);
      background: var(--surface-2);
      border-color: var(--line);
    }

    .danger-btn {
      color: var(--danger);
      background: var(--danger-soft);
      border-color: var(--danger-line);
    }

    .layout {
      height: calc(100% - 58px);
      display: grid;
      min-height: 0;
    }

    .nav {
      border-right: 1px solid var(--line);
      background: var(--nav);
      padding: 18px 14px;
      min-width: 0;
    }

    .nav-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-title {
      margin: 10px 10px 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .nav-item {
      height: 42px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      color: var(--ink-2);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    .nav-item.active {
      color: var(--primary);
      background: var(--primary-soft);
      box-shadow: inset 3px 0 0 var(--primary);
    }

    .glyph {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      display: grid;
      place-items: center;
      color: var(--glyph-ink);
      background: var(--glyph-bg);
      font-size: 12px;
      font-weight: 900;
      font-family: var(--font-num);
    }

    .content {
      min-width: 0;
      min-height: 0;
      padding: 18px;
      background: var(--content);
    }

    .section-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 16px;
    }

    .section-head h1,
    .section-head h2,
    .panel h2,
    .panel h3 {
      margin: 0;
      letter-spacing: 0;
    }

    .section-head h1 {
      font-size: 28px;
      line-height: 1.1;
    }

    .section-head p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .metric {
      min-height: 78px;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--card);
    }

    .metric span,
    .label,
    .meta,
    .table th {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .metric strong {
      display: block;
      margin-top: 9px;
      font: 800 18px/1.2 var(--font-num);
      color: var(--ink);
      letter-spacing: 0;
    }

    .panel {
      min-width: 0;
      min-height: 0;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--card);
      box-shadow: var(--card-shadow);
    }

    .panel-head {
      height: 52px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .panel-head h2,
    .panel-head h3 {
      font-size: 16px;
    }

    .panel-body {
      padding: 14px;
      min-height: 0;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
      min-width: 0;
    }

    .input,
    .textarea,
    .mini-input {
      min-width: 0;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--input);
      color: var(--ink);
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-size: 13px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .input {
      height: 38px;
    }

    .mini-input {
      height: 34px;
    }

    .textarea {
      height: 114px;
      align-items: flex-start;
      padding-top: 10px;
      line-height: 1.6;
      white-space: normal;
      color: var(--muted);
    }

    .target-row,
    .log-row,
    .config-row {
      display: grid;
      align-items: center;
      gap: 12px;
      min-width: 0;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--row);
    }

    .target-row {
      grid-template-columns: 44px minmax(0, 1fr) auto;
      padding: 11px 12px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: var(--avatar-ink);
      background: var(--avatar);
      font-weight: 900;
      font-size: 14px;
    }

    .main-text {
      min-width: 0;
    }

    .main-text strong {
      display: block;
      color: var(--ink);
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .main-text span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chip {
      height: 27px;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      border-radius: 8px;
      color: var(--chip-ink);
      background: var(--chip);
      border: 1px solid var(--chip-line);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .log-row {
      grid-template-columns: 10px minmax(0, 1fr) auto;
      padding: 11px 12px;
      font-size: 13px;
      color: var(--ink-2);
    }

    .log-row span:nth-child(2) {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .log-pin {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .split {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) 340px;
      gap: 14px;
      min-height: 0;
    }

    .two-col {
      display: grid;
      grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr);
      gap: 14px;
      min-height: 0;
    }

    .quick-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .hero-status {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: end;
      padding: 18px;
      border-radius: 8px;
      border: 1px solid var(--hero-line);
      color: var(--hero-ink);
      background: var(--hero);
      box-shadow: var(--hero-shadow);
    }

    .hero-status h2 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .hero-status p {
      margin: 0;
      color: var(--hero-muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .big-number {
      font: 900 46px/1 var(--font-num);
      letter-spacing: 0;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .table th,
    .table td {
      height: 42px;
      padding: 0 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      white-space: nowrap;
    }

    .table td {
      color: var(--ink-2);
    }

    .toast {
      position: absolute;
      right: 28px;
      top: 72px;
      z-index: 9;
      min-width: 260px;
      height: 46px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      border-radius: 8px;
      color: var(--success);
      background: var(--toast);
      border: 1px solid var(--success-line);
      box-shadow: var(--shadow-fine);
      font-weight: 800;
      font-size: 13px;
    }

    .drawer {
      position: absolute;
      top: 72px;
      right: 26px;
      width: 390px;
      bottom: 24px;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--drawer);
      box-shadow: var(--shadow-soft);
      z-index: 6;
    }

    .drawer h2 {
      margin: 2px 0 14px;
      font-size: 18px;
    }

    .config-row {
      grid-template-columns: minmax(0, 1fr) 74px;
      padding: 10px 12px;
      font-size: 13px;
    }

    .config-row strong {
      color: var(--ink);
      font-size: 13px;
      text-align: right;
    }

    .mode-name {
      position: absolute;
      left: 52px;
      bottom: 26px;
      z-index: 12;
      height: 30px;
      display: inline-flex;
      align-items: center;
      padding: 0 10px;
      border-radius: 8px;
      color: var(--watermark);
      background: var(--watermark-bg);
      border: 1px solid var(--line);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .04em;
    }

    .concept-light {
      --bg: linear-gradient(135deg, #eef7ff 0%, #f8fbff 44%, #fff6fb 100%);
      --surface: #ffffff;
      --surface-2: #f6f8fb;
      --top: rgba(255,255,255,.96);
      --content: #f6f8fc;
      --nav: #ffffff;
      --card: #ffffff;
      --row: #fbfcff;
      --input: #fbfcff;
      --drawer: rgba(255,255,255,.96);
      --line: #e4e9f0;
      --ink: #101827;
      --ink-2: #334155;
      --muted: #6b778a;
      --primary: #f35a9c;
      --primary-ink: #fff;
      --primary-soft: #fff0f6;
      --primary-line: #ffd0e4;
      --primary-shadow: 0 12px 22px rgba(243, 90, 156, .22);
      --success: #158466;
      --success-soft: #eafaf4;
      --success-line: #bcebdc;
      --danger: #c43b4b;
      --danger-soft: #fff0f1;
      --danger-line: #ffd2d8;
      --mark: linear-gradient(135deg, #22b8f2, #f35a9c);
      --mark-ink: #fff;
      --mark-shadow: 0 10px 24px rgba(34,184,242,.25);
      --glyph-bg: #eef6ff;
      --glyph-ink: #2280c8;
      --avatar: linear-gradient(135deg, #e0f7ff, #ffe4f1);
      --avatar-ink: #d93886;
      --chip: #eef9ff;
      --chip-ink: #166ba3;
      --chip-line: #cceefe;
      --hero: linear-gradient(135deg, #1e293b 0%, #334155 58%, #22b8f2 140%);
      --hero-ink: #fff;
      --hero-muted: rgba(255,255,255,.72);
      --hero-line: rgba(255,255,255,.2);
      --hero-shadow: 0 18px 40px rgba(30,41,59,.18);
      --toast: #f0fff8;
      --window-shadow: 0 24px 70px rgba(45, 68, 110, .14);
      --card-shadow: 0 10px 26px rgba(45, 68, 110, .06);
      --watermark: #516172;
      --watermark-bg: rgba(255,255,255,.72);
    }

    .concept-dark {
      --bg: linear-gradient(145deg, #181716 0%, #202622 42%, #2a1d22 100%);
      --surface: #151817;
      --surface-2: #202522;
      --top: #171b19;
      --content: #101312;
      --nav: #141816;
      --card: #171d1a;
      --row: #1d2420;
      --input: #121615;
      --drawer: rgba(21,24,23,.96);
      --line: #2c3731;
      --ink: #edf6ef;
      --ink-2: #bfd0c5;
      --muted: #809188;
      --primary: #5ee0a9;
      --primary-ink: #07130e;
      --primary-soft: #183329;
      --primary-line: #285b47;
      --primary-shadow: 0 14px 32px rgba(94,224,169,.16);
      --success: #6ee7b7;
      --success-soft: #17352a;
      --success-line: #2f6d55;
      --danger: #ff8aa0;
      --danger-soft: #351c24;
      --danger-line: #67303e;
      --mark: linear-gradient(135deg, #5ee0a9, #ff9b63);
      --mark-ink: #07130e;
      --mark-shadow: 0 10px 26px rgba(94,224,169,.12);
      --glyph-bg: #26342d;
      --glyph-ink: #95f0c4;
      --avatar: #27342f;
      --avatar-ink: #ffbd8a;
      --chip: #2b211c;
      --chip-ink: #ffbd8a;
      --chip-line: #5f3a29;
      --hero: linear-gradient(135deg, #233a30 0%, #1e2422 52%, #43272e 100%);
      --hero-ink: #f6fff9;
      --hero-muted: #adc7b8;
      --hero-line: #355545;
      --hero-shadow: 0 18px 48px rgba(0,0,0,.28);
      --toast: #12291f;
      --window-shadow: 0 28px 90px rgba(0,0,0,.34);
      --card-shadow: none;
      --watermark: #8fa49a;
      --watermark-bg: rgba(20,24,22,.72);
    }

    .concept-dense {
      --bg: #dfe6ef;
      --surface: #fdfefe;
      --surface-2: #f2f5f8;
      --top: #f8fafc;
      --content: #eef2f6;
      --nav: #f9fbfd;
      --card: #ffffff;
      --row: #ffffff;
      --input: #ffffff;
      --drawer: #ffffff;
      --line: #d7dee8;
      --ink: #111827;
      --ink-2: #2f3a4a;
      --muted: #657285;
      --primary: #2563eb;
      --primary-ink: #fff;
      --primary-soft: #eaf1ff;
      --primary-line: #c9d9ff;
      --primary-shadow: none;
      --success: #047857;
      --success-soft: #e7f7ef;
      --success-line: #b9e8d0;
      --danger: #b42336;
      --danger-soft: #fff0f2;
      --danger-line: #ffd1d9;
      --mark: #2563eb;
      --mark-ink: #fff;
      --mark-shadow: none;
      --glyph-bg: #edf3ff;
      --glyph-ink: #2563eb;
      --avatar: #eff4ff;
      --avatar-ink: #2563eb;
      --chip: #edf7f2;
      --chip-ink: #047857;
      --chip-line: #ccebdd;
      --hero: #ffffff;
      --hero-ink: #111827;
      --hero-muted: #657285;
      --hero-line: #d7dee8;
      --hero-shadow: none;
      --toast: #f1fff8;
      --window-shadow: 0 20px 60px rgba(35, 48, 68, .18);
      --card-shadow: none;
      --watermark: #556170;
      --watermark-bg: rgba(255,255,255,.76);
    }

    .concept-glass {
      --bg: linear-gradient(135deg, #e7f9f5 0%, #f8fbff 45%, #fff1e8 100%);
      --surface: rgba(255,255,255,.78);
      --surface-2: rgba(255,255,255,.56);
      --top: rgba(255,255,255,.72);
      --content: rgba(255,255,255,.2);
      --nav: rgba(255,255,255,.5);
      --card: rgba(255,255,255,.72);
      --row: rgba(255,255,255,.7);
      --input: rgba(255,255,255,.8);
      --drawer: rgba(255,255,255,.82);
      --line: rgba(108,124,140,.22);
      --ink: #14201e;
      --ink-2: #2e4943;
      --muted: #65766f;
      --primary: #127f7a;
      --primary-ink: #fff;
      --primary-soft: rgba(18,127,122,.1);
      --primary-line: rgba(18,127,122,.22);
      --primary-shadow: 0 16px 34px rgba(18,127,122,.18);
      --success: #158466;
      --success-soft: rgba(225,250,240,.86);
      --success-line: rgba(21,132,102,.25);
      --danger: #b74455;
      --danger-soft: rgba(255,240,241,.9);
      --danger-line: rgba(183,68,85,.2);
      --mark: linear-gradient(135deg, #127f7a, #f07f55);
      --mark-ink: #fff;
      --mark-shadow: 0 10px 26px rgba(18,127,122,.2);
      --glyph-bg: rgba(18,127,122,.12);
      --glyph-ink: #127f7a;
      --avatar: linear-gradient(135deg, #d9f6f1, #ffe7d7);
      --avatar-ink: #127f7a;
      --chip: rgba(255,237,226,.8);
      --chip-ink: #b5522d;
      --chip-line: rgba(240,127,85,.25);
      --hero: linear-gradient(135deg, rgba(18,127,122,.94), rgba(240,127,85,.88));
      --hero-ink: #fff;
      --hero-muted: rgba(255,255,255,.78);
      --hero-line: rgba(255,255,255,.34);
      --hero-shadow: 0 18px 42px rgba(33,91,84,.18);
      --toast: rgba(241,255,248,.95);
      --window-shadow: 0 26px 80px rgba(72, 94, 105, .2);
      --card-shadow: 0 10px 30px rgba(72, 94, 105, .08);
      --watermark: #4b5c56;
      --watermark-bg: rgba(255,255,255,.55);
    }

    .concept-bento {
      --bg: linear-gradient(135deg, #f2f7ff 0%, #fff8ed 48%, #eefaf3 100%);
      --surface: #fffdf9;
      --surface-2: #f7f3ed;
      --top: #fffdf9;
      --content: #f7f2ea;
      --nav: #fffdf9;
      --card: #fffdf9;
      --row: #fffaf1;
      --input: #fffdf9;
      --drawer: #fffdf9;
      --line: #e7ded1;
      --ink: #231f1a;
      --ink-2: #4a4035;
      --muted: #796d5f;
      --primary: #cc4c2f;
      --primary-ink: #fff;
      --primary-soft: #fff0eb;

    const params = new URLSearchParams(location.search);

    if (selected === "gallery") {
      document.body.className = "gallery";
      app.innerHTML = `<div class="gallery-grid">${concepts.map((concept) => `
        <section class="gallery-item">
          <h2>${concept.title}</h2>
